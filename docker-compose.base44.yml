services:
  # One-shot dependency installer. It is the ONLY thing that ever writes node_modules, and it runs
  # before the dev server starts. Installing inside the serving container rewrote node_modules under
  # the live Rsbuild process, which then died mid-request with
  # `ERR_MODULE_NOT_FOUND: @rsbuild/core/dist/0~range-parser.js` (a lazily imported chunk that had
  # disappeared from disk). Keeping the install out of `web` removes that failure mode entirely.
  # The lock hash is written only after a finished install, so an interrupted install is re-run
  # by the next `docker compose up -d`.
  install:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command:
      - sh
      - -ec
      - |
        # One installer at a time. Two `npm ci` runs racing in the shared volume rewrite it under
        # the live dev server, which then dies mid-request with ERR_MODULE_NOT_FOUND. flock
        # serialises them; the waiter re-reads the hash below and exits without reinstalling.
        exec 9>node_modules/.base44-install.lock
        flock 9
        lock_hash=$$(md5sum package-lock.json | cut -d' ' -f1)
        if [ -f node_modules/.package-lock.json ] && [ "$$(cat node_modules/.base44-lock-hash 2>/dev/null)" = "$$lock_hash" ]; then
            echo "node_modules already matches package-lock.json — nothing to install"
            exit 0
        fi
        # Drop the finished marker first: `web` waits for it, so a dev server that restarts
        # mid-install never serves a half-written node_modules.
        rm -f node_modules/.base44-lock-hash
        npm ci --no-audit --no-fund
        printf '%s\n' "$$lock_hash" > node_modules/.base44-lock-hash
    restart: "no"

  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:4003"
    environment:
      - BASE44_PREVIEW_MODE
    command:
      - sh
      - -ec
      - |
        lock_hash=$$(md5sum package-lock.json | cut -d' ' -f1)
        while [ "$$(cat node_modules/.base44-lock-hash 2>/dev/null)" != "$$lock_hash" ]; do
            echo "waiting for the installer to finish node_modules"
            sleep 2
        done
        exec npm run dev -- --host 0.0.0.0
    depends_on:
      install:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4003/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  node_modules:
