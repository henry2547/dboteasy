services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:4003"
    environment:
      - BASE44_PREVIEW_MODE=1
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
      - BASE44_SANDBOX_HOST_DOMAIN=${BASE44_SANDBOX_HOST_DOMAIN:-}
      - NEXT_PUBLIC_DERIV_APP_ID=34nLjEhE1953XqMLVUwLf
      - NEXT_PUBLIC_DERIV_APP_NAME=dboteasy
      - NEXT_PUBLIC_DERIV_ENV=production
    command: ["sh", "-ec", "npm install && exec npx rsbuild dev --host 0.0.0.0 --port 4003"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4003/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  node_modules:
